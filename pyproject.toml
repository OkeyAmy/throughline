[project]
name = "throughline"
version = "0.1.0"
description = "Cross-repo change-impact service for coding agents, backed by HydraDB"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.2"]

[project.scripts]
throughline = "loader.__main__:main"

[tool.setuptools]
packages = ["loader", "server", "mcp_server", "eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
